            let type = "video/mp4";

            // Enable Background Playback via Media Session API

                    navigator.mediaSession.setActionHandler('pause', function () {

                    navigator.mediaSession.setActionHandler('seekbackward', function () {

                    });
                    navigator.mediaSession.setActionHandler('seekforward', function () {
                        if (typeof window._seekPlayer === 'function') window._seekPlayer(10);
                    });
                } catch (msErr) {
                    console.warn('[Player] MediaSession registration skipped:', msErr);
                }
            }

            // Keep user activation gesture fresh on any interaction (click, touch, key, pointer)
            ['click', 'pointerdown', 'touchstart', 'keydown'].forEach(function (evt) {
                document.addEventListener(evt, function () {
                    window._lastGestureTime = Date.now();
                }, { capture: true, passive: true });
            });

            // Automatic Picture-in-Picture (Enter on tab background, Exit on tab restore)
            document.addEventListener('visibilitychange', function () {
                if (document.hidden) {
                    if (video && !video.paused && document.pictureInPictureEnabled && !document.pictureInPictureElement && typeof video.requestPictureInPicture === 'function') {
                        try {
                            video.requestPictureInPicture().catch(function (e) {
                                console.log('[PiP] Auto enter skipped by browser policy:', e);
                            });
                        } catch (e) {}
                    }
                }
            });

            if ('mediaSession' in navigator && typeof navigator.mediaSession.setActionHandler === 'function') {
                try {
                    navigator.mediaSession.setActionHandler('enterpictureinpicture', async function () {
                        if (video && typeof video.requestPictureInPicture === 'function' && !document.pictureInPictureElement) {
                            try {
                                await video.requestPictureInPicture();
                            } catch (e) {}
                        }
                    });
                } catch (e) {}

                const isCustomScheme = typeof source === 'string' && (

                    source.startsWith('dramabox:') ||

                    source.startsWith('shortmax:') ||

                    source.startsWith('netshort:') ||

                    source.startsWith('reelshort:') ||

                    source.startsWith('meloshort:') ||

                    videoEl.play().catch(err => {

                        console.warn('[EmbedPlayer] Play blocked, attempting muted play:', err);

                        videoEl.muted = true;

                        videoEl.play().then(() => {

                            if (window.parent && window.parent !== window) {

                                try {

                                    window.parent.postMessage('videoAutoplayBlocked', '*');

                                } catch (e2) { }

                            }

                        }).catch(e3 => {

                            console.error('[EmbedPlayer] Muted play also failed:', e3);

                        });

                    });

                } else if (typeof data === 'object') {

                    if (data.type === 'unmute') {

                        videoEl.muted = false;

                        console.log('[EmbedPlayer] Video unmuted via message');

                    } else if (data.type === 'seek') {

                        const seconds = data.seconds || 10;

                        if (typeof window._seekPlayer === 'function') {

                            window._seekPlayer(seconds);

                        } else if (window._plyrPlayer) {

                            let newTime = window._plyrPlayer.currentTime + seconds;

                            if (newTime < 0) newTime = 0;

                            if (window._plyrPlayer.duration && newTime > window._plyrPlayer.duration) newTime = window._plyrPlayer.duration;

                            window._plyrPlayer.currentTime = newTime;

                        } else if (videoEl) {

                            videoEl.currentTime = Math.max(0, videoEl.currentTime + seconds);

                        }

                    } else if (data.type === 'toggle-pip' || data.type === 'pip') {
                        if (document.pictureInPictureElement) {
                            document.exitPictureInPicture().catch(function(e) { console.warn('[PiP] Exit error:', e); });
                        } else if (videoEl && typeof videoEl.requestPictureInPicture === 'function') {
                            videoEl.requestPictureInPicture().catch(function(e) { console.warn('[PiP] Request error:', e); });
                        }
                    } else if (data.type === 'enter-pip') {
                        if (videoEl && !videoEl.paused && document.pictureInPictureEnabled && !document.pictureInPictureElement && typeof videoEl.requestPictureInPicture === 'function') {
                            videoEl.requestPictureInPicture().catch(function(e){});
                        }
                    } else if (data.type === 'exit-pip') {
                        if (document.pictureInPictureElement && typeof document.exitPictureInPicture === 'function') {
                            document.exitPictureInPicture().catch(function(e){});
                        }
                    } else if (data.type === 'setPlaybackRate') {

                        const rate = data.rate || 1.0;

                        videoEl.defaultPlaybackRate = rate;

                        videoEl.playbackRate = rate;

                        

                        try {

                            localStorage.setItem('playbackRate', rate.toString());

                        } catch (e) { }



                        if (window.parent && window.parent !== window) {
                            try {
                                window.parent.postMessage({ type: 'playbackRateChanged', rate: rate }, '*');
                            } catch (e) { }
                        }
                    } else if (data.type === 'keydown') {
                        handleGlobalKeyShortcut({ key: data.key, code: data.code, target: document.body });
                    }
                }
            });



            // Global seek function used by custom overlay buttons

            window._seekPlayer = function(seconds) {
                if (window._plyrPlayer) {
                    let newTime = window._plyrPlayer.currentTime + seconds;
                    if (newTime < 0) newTime = 0;
                    if (window._plyrPlayer.duration && !isNaN(window._plyrPlayer.duration) && newTime > window._plyrPlayer.duration) {
                        newTime = window._plyrPlayer.duration;
                    }
                    window._plyrPlayer.currentTime = newTime;
                    console.log('[Seek] Jumped ' + seconds + 's to ' + Math.round(newTime) + 's');
                } else {
                    const video = document.getElementById('_0x_pv');
                    if (video) {
                        let targetTime = video.currentTime + seconds;
                        if (targetTime < 0) targetTime = 0;
                        if (video.duration && !isNaN(video.duration) && targetTime > video.duration) {
                            targetTime = video.duration;
                        }
                        video.currentTime = targetTime;
                        console.log('[Seek] Native video jumped ' + seconds + 's to ' + Math.round(targetTime) + 's');
                    }
                }

                // Seek animasyonu: butonu parlat

                const btn = seconds < 0

                    ? document.querySelector('.custom-skip-back')

                    : document.querySelector('.custom-skip-forward');

                if (btn) {

                    btn.style.background = '#e50914';

                    btn.style.borderColor = '#e50914';

                    btn.style.boxShadow = '0 0 20px rgba(229,9,20,0.7)';

                    setTimeout(() => {

                        btn.style.background = '';

                        btn.style.borderColor = '';

                        btn.style.boxShadow = '';

                    }, 300);

                }

            };



            // Play/Pause ikonunu merkez göstergeyle senkronize et

            function _syncSkipCenterIcon(isPaused) {

                const playIcon  = document.getElementById('_skip_play_icon');

                const pauseIcon = document.getElementById('_skip_pause_icon');

                if (!playIcon || !pauseIcon) return;

                if (isPaused) {

                    playIcon.style.display  = 'block';

                    pauseIcon.style.display = 'none';

                } else {

                    playIcon.style.display  = 'none';

                    pauseIcon.style.display = 'block';

                }

            }

            // Video element ile senkronize et

            const _vidEl = document.getElementById('_0x_pv');

            if (_vidEl) {

                _vidEl.addEventListener('play',  () => _syncSkipCenterIcon(false));

                _vidEl.addEventListener('pause', () => _syncSkipCenterIcon(true));

                _syncSkipCenterIcon(_vidEl.paused);

            }



            // Initialize Plyr Custom Controls

            try {

                const videoEl = document.getElementById('_0x_pv');

                if (videoEl) {

                    const player = new Plyr(videoEl, {

                        controls: ['play', 'progress', 'current-time', 'mute', 'volume', 'captions', 'settings', 'pip', 'fullscreen'],

                        settings: ['captions', 'quality', 'speed'],

                        pip: { enabled: true },

                        seekTime: 10,

                        tooltips: { controls: true, seek: true },

                        captions: { active: true, update: true, language: 'tr' },

                        clickToPlay: false // Disable built-in play/pause to handle custom single/double-click manually

                    });

                    window._plyrPlayer = player;



                    player.on('ready', () => {
                        try {
                            if (typeof window.activateSubtitles === 'function') {
                                window.activateSubtitles();
                            }
                            player.toggleCaptions(true);
                            if (player.captions) {
                                player.captions.active = true;
                            }
                        } catch(e) {}

                        const plyrContainer = videoEl.closest('.plyr');

                        const skipOverlay = document.getElementById('_skip_overlay');

                        const dtLeft = document.getElementById('_dt_left');

                        const dtRight = document.getElementById('_dt_right');

                        

                        // Move skip controls and double-tap animations inside the Plyr wrapper

                        if (plyrContainer) {

                            if (skipOverlay) plyrContainer.appendChild(skipOverlay);

                            if (dtLeft) plyrContainer.appendChild(dtLeft);

                            if (dtRight) plyrContainer.appendChild(dtRight);

                            

                            // Initialize custom single/double click handler

                            let clickTimeout = null;

                            let lastClickTime = 0;

                            

                            // Capturing click listener to handle custom controls and single/double clicks

                            plyrContainer.addEventListener('click', function(e) {

                                // If click is inside Plyr native controls, let them work naturally

                                if (e.target.closest('.plyr__controls, .plyr__control, .plyr__menu, .plyr__progress, .plyr__volume')) {

                                    return;

                                }

                                

                                // Intercept everything else (video clicks and custom buttons)

                                e.stopPropagation();

                                e.preventDefault();

                                

                                // Trigger ad popups synchronously on first click (reklam mantığı bozulmaz)

                                if (typeof triggerAds === 'function') {

                                    triggerAds();

                                }

                                

                                // Handle click on our custom skip overlay buttons

                                const customBtn = e.target.closest('.custom-skip-btn, .skip-center-indicator');

                                if (customBtn) {

                                    if (customBtn.classList.contains('custom-skip-back')) {

                                        window._seekPlayer(-10);

                                    } else if (customBtn.classList.contains('custom-skip-forward')) {

                                        window._seekPlayer(10);

                                    } else if (customBtn.classList.contains('skip-center-indicator') || customBtn.id === '_skip_center_icon') {

                                        window._togglePlay();

                                    }

                                    return;

                                }

                                

                                // Handle single/double clicks on the video area

                                const rect = plyrContainer.getBoundingClientRect();

                                const clickX = e.clientX - rect.left;

                                const isLeft = clickX < (rect.width / 2);

                                const currentTime = new Date().getTime();

                                const tapInterval = currentTime - lastClickTime;

                                

                                if (tapInterval < 300 && tapInterval > 0) {

                                    // Double click: seek back or forward

                                    clearTimeout(clickTimeout);

                                    clickTimeout = null;

                                    

                                    if (isLeft) {

                                        window._seekPlayer(-10);

                                        triggerDoubleTapAnimation('left');

                                    } else {

                                        window._seekPlayer(10);

                                        triggerDoubleTapAnimation('right');

                                    }

                                    lastClickTime = 0; // reset

                                } else {

                                    // Single click: toggle play/pause after a short delay

                                    clearTimeout(clickTimeout);

                                    clickTimeout = setTimeout(() => {

                                        window._togglePlay();

                                        clickTimeout = null;

                                    }, 250);

                                    lastClickTime = currentTime;

                                }

                            }, true); // Use capturing phase (true) to intercept clicks before Plyr gets them

                        }



                        setTimeout(() => {

                            try {

                                player.toggleCaptions(true);

                                console.log('[Player] Plyr captions forced ON');

                            } catch (e) { }

                        }, 400);

                    });



                    player.on('play', () => {

                        try {

                            player.toggleCaptions(true);

                        } catch (e) { }

                    });

                } else {

                    console.warn('[Player] Video element not found in DOM, skipping Plyr initialization.');

                }

            } catch (plyrError) {

                console.error('[Player] Failed to initialize Plyr:', plyrError);

            }



            // Function to trigger double-tap visual animation

            function triggerDoubleTapAnimation(side) {

                const indicator = document.getElementById(side === 'left' ? '_dt_left' : '_dt_right');

                if (indicator) {

                    indicator.classList.remove('animate-flash');

                    void indicator.offsetWidth; // Force CSS reflow

                    indicator.classList.add('animate-flash');

                }

            }



            // Global togglePlay function for center overlay button and screen click
            window._togglePlay = function() {
                if (window._plyrPlayer) {
                    if (window._plyrPlayer.paused) {
                        window._plyrPlayer.play();
                    } else {
                        window._plyrPlayer.pause();
                    }
                } else if (video) {
                    if (video.paused) {
                        video.play();
                    } else {
                        video.pause();
                    }
                }
            };

            // Keyboard Shortcuts Manager (Desktop: Left/Right = Seek 10s, Up/Down = Prev/Next Episode, Space/K = Play, F = Fullscreen, M = Mute)
            function handleGlobalKeyShortcut(e) {
                const tag = (e.target && e.target.tagName) ? e.target.tagName.toUpperCase() : '';
                if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (e.target && e.target.isContentEditable)) {
                    return;
                }

                const key = e.key;
                if (key === 'ArrowLeft') {
                    if (typeof e.preventDefault === 'function') e.preventDefault();
                    if (typeof window._seekPlayer === 'function') window._seekPlayer(-10);
                    if (typeof triggerDoubleTapAnimation === 'function') triggerDoubleTapAnimation('left');
                } else if (key === 'ArrowRight') {
                    if (typeof e.preventDefault === 'function') e.preventDefault();
                    if (typeof window._seekPlayer === 'function') window._seekPlayer(10);
                    if (typeof triggerDoubleTapAnimation === 'function') triggerDoubleTapAnimation('right');
                } else if (key === 'ArrowUp') {
                    if (typeof e.preventDefault === 'function') e.preventDefault();
                    if (window.parent && window.parent !== window) {
                        try { window.parent.postMessage({ type: 'changeEpisode', direction: 'up' }, '*'); } catch(e){}
                    }
                } else if (key === 'ArrowDown') {
                    if (typeof e.preventDefault === 'function') e.preventDefault();
                    if (window.parent && window.parent !== window) {
                        try { window.parent.postMessage({ type: 'changeEpisode', direction: 'down' }, '*'); } catch(e){}
                    }
                } else if (key === ' ' || key === 'k' || key === 'K') {
                    if (typeof e.preventDefault === 'function') e.preventDefault();
                    if (typeof window._togglePlay === 'function') window._togglePlay();
                } else if (key === 'f' || key === 'F') {
                    if (typeof e.preventDefault === 'function') e.preventDefault();
                    if (window._plyrPlayer) {
                        window._plyrPlayer.fullscreen.toggle();
                    } else if (video) {
                        if (document.fullscreenElement) {
                            document.exitFullscreen().catch(function(){});
                        } else {
                            video.requestFullscreen().catch(function(){});
                        }
                    }
                } else if (key === 'm' || key === 'M') {
                    if (typeof e.preventDefault === 'function') e.preventDefault();
                    if (window._plyrPlayer) {
                        window._plyrPlayer.muted = !window._plyrPlayer.muted;
                    } else if (video) {
                        video.muted = !video.muted;
                    }
                }
            }

            document.addEventListener('keydown', handleGlobalKeyShortcut);

            // Unload event fallback for robust garbage collection of video decoders

            window.addEventListener('unload', function() {

                console.log('[EmbedPlayer] Unload triggered, releasing media pipeline.');

                if (window._plyrPlayer) {

                    try { window._plyrPlayer.destroy(); } catch(e) {}

                    window._plyrPlayer = null;

                }

                if (window._hlsPlayer) {

                    try { window._hlsPlayer.destroy(); } catch(e) {}

                    window._hlsPlayer = null;

                }

                const videoEl = document.getElementById('_0x_pv');

                if (videoEl) {

                    videoEl.removeAttribute('src');

                    videoEl.src = '';

                    try { videoEl.load(); } catch(e) {}

                }

            });

        });

    </script>
