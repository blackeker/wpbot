<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Üniversite Yemek Menüsü</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .menu-card { transition: all 0.3s ease; }
        .menu-card:hover { transform: translateY(-5px); }
        .gradient-bg { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); }
    </style>
</head>
<body class="min-h-screen pb-12">

    <!-- Header -->
    <header class="gradient-bg text-white py-10 px-4 shadow-lg mb-8">
        <div class="max-w-4xl mx-auto text-center">
            <h1 class="text-4xl font-bold mb-2 flex justify-center items-center gap-3">
                <i class="fas fa-utensils"></i> Üniversite Yemek Menüsü
            </h1>
            <p class="text-indigo-100 opacity-90">Bugün ne yiyoruz? Menüyü kontrol et!</p>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4">

        <!-- Controls -->
        <div class="flex flex-wrap gap-4 justify-center mb-8">
            <button onclick="fetchMenu('today')" class="px-6 py-2 bg-white text-indigo-600 font-semibold rounded-full shadow-sm border border-indigo-100 hover:bg-indigo-50 transition-colors flex items-center gap-2">
                <i class="fas fa-calendar-day"></i> Bugün
            </button>
            <button onclick="fetchMenu('tomorrow')" class="px-6 py-2 bg-white text-indigo-600 font-semibold rounded-full shadow-sm border border-indigo-100 hover:bg-indigo-50 transition-colors flex items-center gap-2">
                <i class="fas fa-calendar-alt"></i> Yarın
            </button>
            <div class="flex items-center gap-2 bg-white px-4 py-2 rounded-full shadow-sm border border-indigo-100">
                <i class="fas fa-search text-gray-400"></i>
                <input type="date" id="datePicker" onchange="fetchMenu('selected')" class="outline-none text-indigo-600 font-medium bg-transparent cursor-pointer">
            </div>
        </div>

        <!-- Content Area -->
        <div id="content" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Menus will be injected here -->
            <div class="col-span-full text-center py-20 text-gray-400">
                <i class="fas fa-spinner fa-spin text-4xl mb-4"></i>
                <p>Menü yükleniyor...</p>
            </div>
        </div>
    </main>

    <script>
        const API_BASE = 'http://localhost:3000/api';

        function formatDate(date) {
            const d = new Date(date);
            return `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth() + 1).padStart(2, '0')}.${d.getFullYear()}`;
        }

        async function fetchMenu(type) {
            let dateStr = '';
            const now = new Date();

            if (type === 'today') {
                dateStr = formatDate(now);
            } else if (type === 'tomorrow') {
                const tomorrow = new Date();
                tomorrow.setDate(now.getDate() + 1);
                dateStr = formatDate(tomorrow);
            } else {
                const selected = document.getElementById('datePicker').value;
                if (!selected) return;
                const [y, m, d] = selected.split('-');
                dateStr = `${d}.${m}.${y}`;
            }

            const contentDiv = document.getElementById('content');
            contentDiv.innerHTML = `
                <div class="col-span-full text-center py-20 text-gray-400">
                    <i class="fas fa-spinner fa-spin text-4xl mb-4"></i>
                    <p>Menü getiriliyor...</p>
                </div>
            `;

            try {
                const response = await fetch(`${API_BASE}/menu?date=${dateStr}`);
                if (!response.ok) throw new Error('Menü bulunamadı');
                const data = await response.json();
                renderMenu(data);
            } catch (err) {
                contentDiv.innerHTML = `
                    <div class="col-span-full text-center py-20 bg-red-50 rounded-3xl border-2 border-dashed border-red-200 text-red-500">
                        <i class="fas fa-exclamation-circle text-4xl mb-4"></i>
                        <p class="text-lg font-semibold">${dateStr} tarihi için menü kaydı bulunamadı.</p>
                        <p class="text-sm opacity-80">Lütfen başka bir tarih seçiniz.</p>
                    </div>
                `;
            }
        }

        function renderMenu(data) {
            const contentDiv = document.getElementById('content');

            const createSection = (title, icon, items, colorClass) => {
                if (!items || items.length === 0) return '';

                return `
                    <div class="menu-card bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden">
                        <div class="${colorClass} text-white py-4 px-6 flex justify-between items-center">
                            <h3 class="text-xl font-bold flex items-center gap-2">
                                <i class="${icon}"></i> ${title}
                            </h3>
                            <span class="text-sm opacity-80">${data.tarih}</span>
                        </div>
                        <div class="p-6">
                            <ul class="space-y-4">
                                ${items.map(item => `
                                    <li class="flex items-center gap-3 p-3 rounded-xl bg-gray-50 hover:bg-indigo-50 transition-colors group">
                                        <span class="text-2xl group-hover:scale-125 transition-transform">${item.emoji || '🍽️'}</span>
                                        <span class="text-gray-700 font-medium">${item.text}</span>
                                    </li>
                                `).join('')}
                            </ul>
                        </div>
                    </div>
                `;
            };

            contentDiv.innerHTML = `
                ${createSection('Kahvaltı', 'fas fa-coffee', data.kahvalti, 'bg-orange-400')}
                ${createSection('Akşam Yemeği', 'fas fa-utensils', data.aksam_yemegi, 'bg-indigo-600')}
            `;
        }

        // Sayfa yüklendiğinde bugünü getir
        window.onload = () => fetchMenu('today');
    </script>
</body>
</html>
