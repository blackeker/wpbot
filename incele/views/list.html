<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İndirilen Videolar - HDWP Media Library</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #080710;
      --panel-bg: rgba(255, 255, 255, 0.03);
      --panel-border: rgba(255, 255, 255, 0.08);
      --accent-green: #10b981;
      --accent-blue: #3b82f6;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --glow-blue: rgba(59, 130, 246, 0.2);
    }

    * {
      box-sizing: border-box;
      transition: all 0.25s ease;
    }

    body {
      margin: 0;
      background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 70%, var(--bg-color) 100%);
      color: var(--text-main);
      font-family: 'Outfit', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 30px 15px;
    }

    .container {
      background: var(--panel-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--panel-border);
      border-radius: 32px;
      padding: 40px;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 30px 70px -10px rgba(0, 0, 0, 0.8),
                  inset 0 1px 0 rgba(255, 255, 255, 0.05);
      text-align: center;
    }

    h1 {
      font-weight: 800;
      font-size: 2.2rem;
      margin-top: 0;
      margin-bottom: 30px;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #34d399 0%, #3b82f6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 10px rgba(59, 130, 246, 0.15));
    }

    .media-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 25px;
      max-height: 480px;
      overflow-y: auto;
      padding-right: 5px;
    }

    /* Scrollbar Style */
    .media-list::-webkit-scrollbar {
      width: 6px;
    }
    .media-list::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.02);
      border-radius: 999px;
    }
    .media-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
    }

    .media-item {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 16px 20px;
      border-radius: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-align: left;
    }

    .media-item:hover {
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(59, 130, 246, 0.25);
      transform: translateY(-2px);
    }

    .media-info {
      font-weight: 600;
      font-size: 0.95rem;
      word-break: break-all;
      padding-right: 15px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .play-btn {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.85rem;
      white-space: nowrap;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
    }

    .play-btn:hover {
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4);
      transform: translateY(-1px);
      filter: brightness(1.1);
    }

    .back-btn {
      display: inline-block;
      color: #3b82f6;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .back-btn:hover {
      opacity: 0.8;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎬 Medya Kütüphanesi</h1>
    <div class="media-list">
      {{LIST_HTML}}
    </div>
    <a href="/" class="back-btn">← Panele Geri Dön</a>
  </div>
</body>
</html>
