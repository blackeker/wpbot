<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>İndirilen Videolar - WPBot Medya Kasası</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-0: #000000;
      --bg-1: #09090b;
      --bg-2: #121215;
      --border-1: rgba(255, 255, 255, 0.08);
      --border-2: rgba(255, 255, 255, 0.16);
      --text-1: #ffffff;
      --text-2: #d4d4d8;
      --text-3: #71717a;
      --radius-md: 12px;
      --radius-lg: 20px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-0);
      color: var(--text-1);
      font-family: 'Inter', -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .container {
      background: var(--bg-1);
      border: 1px solid var(--border-1);
      border-radius: var(--radius-lg);
      padding: 32px 24px;
      width: 100%;
      max-width: 640px;
    }

    h1 {
      font-weight: 800;
      font-size: 1.6rem;
      letter-spacing: -0.03em;
      margin-bottom: 24px;
      text-align: center;
      color: #fff;
    }

    .media-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 24px;
      max-height: 480px;
      overflow-y: auto;
    }

    .media-item {
      background: var(--bg-2);
      border: 1px solid var(--border-1);
      padding: 14px 16px;
      border-radius: var(--radius-md);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .media-item:hover {
      border-color: var(--border-2);
    }

    .media-info {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-2);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .play-btn {
      background: #ffffff;
      color: #000000;
      text-decoration: none;
      font-weight: 700;
      font-size: 12px;
      padding: 8px 14px;
      border-radius: var(--radius-md);
      flex-shrink: 0;
      transition: all 0.15s;
    }

    .play-btn:hover {
      background: #e4e4e7;
    }

    .back-btn {
      display: block;
      text-align: center;
      color: var(--text-3);
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      margin-top: 16px;
      transition: color 0.15s;
    }

    .back-btn:hover {
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📁 İndirilen Videolar</h1>
    <div class="media-list">
      {{LIST_HTML}}
    </div>
    <a href="/" class="back-btn">← Dashboard'a Geri Dön</a>
  </div>
</body>
</html>
