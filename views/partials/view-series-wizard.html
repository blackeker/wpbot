<section class="view-panel" id="view-series-wizard">
        <div class="card">
          <div class="card-header">
            <span class="card-title">🎬 Dizi / Anime / Film Toplu Bölüm İndirme</span>
            <span class="badge">Animecix / HDFilm / HDKore / SezonlukDizi</span>
          </div>

          <div class="form-group">
            <label class="form-label">Dizi veya Sezon Linki</label>
            <div style="display: flex; gap: 8px;">
              <input type="text" id="series-wizard-url" class="input-text" placeholder="https://animecix.net/titles/... veya https://www.hdfilmcehennemi.life/dizi/...">
              <button class="btn btn-primary" style="flex-shrink: 0;" onclick="fetchSeriesEpisodes()" id="series-wizard-fetch-btn">Bölümleri Getir</button>
            </div>
          </div>

          <div id="series-step2-panel" style="display: none; margin-top: 20px;">
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;">
              <h3 id="series-detected-title" style="font-size: 15px; font-weight: 700; color: #fff;">Dizi Başlığı</h3>
              <div style="display: flex; gap: 8px;">
                <button class="btn btn-secondary btn-sm" onclick="toggleSelectAllEpisodes(true)">Tümünü Seç</button>
                <button class="btn btn-secondary btn-sm" onclick="toggleSelectAllEpisodes(false)">Seçimi Kaldır</button>
              </div>
            </div>

            <div id="series-episodes-container" style="max-height: 320px; overflow-y: auto; border: 1px solid var(--border-1); border-radius: var(--radius-md); padding: 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; margin-bottom: 16px;">
            </div>

            <div class="grid-2" style="margin-bottom: 0;">
              <div class="form-group">
                <label class="form-label">WhatsApp Gönderim Numarası (Opsiyonel)</label>
                <input type="text" id="series-target-phone" class="input-text" placeholder="905xxxxxxxxx">
              </div>
              <div style="display: flex; align-items: flex-end; margin-bottom: 16px;">
                <button class="btn btn-primary btn-block" onclick="downloadSelectedSeriesEpisodes()" id="series-bulk-download-btn">Seçili Bölümleri Kuyruğa Ekle</button>
              </div>
            </div>
          </div>
        </div>
      </section>
