<section class="view-panel" id="view-media-vault">
        <div class="card">
          <!-- Explorer header and location bar -->
          <div class="card-header" style="flex-wrap: wrap; gap: 10px;">
            <div class="fe-location-group">
              <label class="sr-only" for="fe-root-select">Sürücü veya dosya sistemi kökü</label>
              <select id="fe-root-select" class="input-select fe-root-select" onchange="navigateExplorerRoot(this.value)" aria-label="Sürücü veya dosya sistemi kökü">
                <option value="">Kökler yükleniyor...</option>
              </select>
              <button class="btn btn-secondary btn-sm" id="fe-up-button" onclick="navigateExplorerUp()" title="Üst klasör" aria-label="Üst klasör">↑ Üst</button>
              <span class="badge" id="fe-stats-badge">Yükleniyor...</span>
            </div>
            
            <div style="display: flex; flex-wrap: wrap; gap: 8px;">
              <button class="btn btn-secondary btn-sm" onclick="sendSelectedFilesPrompt()" id="fe-btn-batch-wa">
                <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none" style="vertical-align: -2px;"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
                <span>WhatsApp'a Gönder</span>
              </button>
              <button class="btn btn-secondary btn-sm" onclick="zipSelectedFiles()">
                <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none" style="vertical-align: -2px;"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
                <span>Seçilenleri ZIP Yap</span>
              </button>
              <button class="btn btn-danger btn-sm" onclick="deleteSelectedFilesAction()">Seçilenleri Sil</button>
              <button class="btn btn-secondary btn-sm" onclick="loadMediaVault()">
                <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none" style="vertical-align: -2px;"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
                <span>Yenile</span>
              </button>
            </div>
          </div>

          <nav class="fe-breadcrumbs" id="fe-breadcrumbs" aria-label="Dosya yolu"></nav>

          <!-- Explorer Filter & Search Toolbar -->
          <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 14px;">
            <div class="preset-pills" style="margin-top: 0;" id="fe-filter-pills">
              <button class="pill active" onclick="setFileCategoryFilter('all')">Tümü (<span id="fe-cnt-all">0</span>)</button>
              <button class="pill" onclick="setFileCategoryFilter('pdf')">📖 PDF / Manga (<span id="fe-cnt-pdf">0</span>)</button>
              <button class="pill" onclick="setFileCategoryFilter('video')">🎬 Video (<span id="fe-cnt-video">0</span>)</button>
              <button class="pill" onclick="setFileCategoryFilter('audio')">🎵 Ses / Müzik (<span id="fe-cnt-audio">0</span>)</button>
              <button class="pill" onclick="setFileCategoryFilter('archive')">📦 Arşiv (<span id="fe-cnt-archive">0</span>)</button>
              <button class="pill" onclick="setFileCategoryFilter('other')">📁 Diğer (<span id="fe-cnt-other">0</span>)</button>
            </div>

            <div style="display: flex; gap: 8px; align-items: center; flex: 1; justify-content: flex-end; min-width: 280px;">
              <input type="text" id="fe-search-input" class="input-text" placeholder="🔍 Dosya ara..." oninput="onFileSearch(this.value)" style="max-width: 200px; padding: 6px 12px; font-size: 12px;">
              <select id="fe-sort-select" class="input-select" onchange="onFileSortChange(this.value)" style="width: 140px; padding: 6px 10px; font-size: 12px;">
                <option value="date-desc">En Yeni Tarih</option>
                <option value="date-asc">En Eski Tarih</option>
                <option value="name-asc">İsim (A-Z)</option>
                <option value="name-desc">İsim (Z-A)</option>
                <option value="size-desc">Boyut (Büyük)</option>
                <option value="size-asc">Boyut (Küçük)</option>
              </select>
              <div style="display: flex; border: 1px solid var(--border-1); border-radius: var(--radius-sm); overflow: hidden;">
                <button class="btn btn-secondary btn-sm" id="fe-btn-view-table" onclick="setFileViewMode('table')" style="border-radius: 0; padding: 6px 9px;" title="Tablo Görünümü">
                  <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
                </button>
                <button class="btn btn-secondary btn-sm" id="fe-btn-view-grid" onclick="setFileViewMode('grid')" style="border-radius: 0; padding: 6px 9px;" title="Kart Görünümü">
                  <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                </button>
              </div>
            </div>
          </div>

          <!-- Explorer Table View -->
          <div class="table-responsive" id="fe-container-table">
            <table class="mono-table">
              <thead>
                <tr>
                  <th width="40"><input type="checkbox" id="vault-select-all" onchange="toggleSelectAllVault(this.checked)" aria-label="Dosyaların tümünü seç"></th>
                  <th>Dosya Adı</th>
                  <th width="110">Kategori</th>
                  <th width="110">Boyut</th>
                  <th width="150">Değiştirilme</th>
                  <th width="260">İşlemler</th>
                </tr>
              </thead>
              <tbody id="media-vault-tbody">
                <tr><td colspan="6" style="text-align: center; color: var(--text-5); padding: 24px;">Dosyalar yükleniyor...</td></tr>
              </tbody>
            </table>
          </div>

          <!-- Explorer Grid View -->
          <div id="fe-container-grid" class="fe-grid" style="display: none; margin-top: 10px;"></div>
        </div>
      </section>
