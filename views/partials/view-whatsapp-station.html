<section class="view-panel" id="view-whatsapp-station">
        <div class="grid-2">
          <!-- PAIRING / QR CARD -->
          <div class="card">
            <div class="card-header">
              <span class="card-title">📱 WhatsApp Oturum & Eşleşme</span>
              <span class="badge" id="wa-connection-badge">Bağlantı Yok</span>
            </div>

            <div id="wa-pairing-box" style="margin-bottom: 20px;">
              <label class="form-label">Telefon Numarası ile 8 Haneli Eşleşme Kodu Al</label>
              <div style="display: flex; gap: 8px;">
                <input type="text" id="wa-pairing-phone" class="input-text" placeholder="905xxxxxxxxx">
                <button class="btn btn-primary" onclick="requestNewPairingCode()">Kodu Üret</button>
              </div>
              <div id="wa-pairing-code-display" style="display: none; margin-top: 14px; text-align: center; padding: 16px; background: #ffffff; color: #000000; border-radius: var(--radius-md); font-family: var(--font-mono); font-size: 24px; font-weight: 900; letter-spacing: 0.2em;">
                ---- ----
              </div>
            </div>

            <div id="wa-qr-box" style="text-align: center; border-top: 1px solid var(--border-1); padding-top: 16px;">
              <button class="btn btn-secondary btn-sm" onclick="requestQrAction()" style="margin-bottom: 12px;">QR Kod ile Bağlan</button>
              <div id="wa-qr-img-container" style="display: none; margin: 0 auto; width: 220px; height: 220px; background: #fff; padding: 10px; border-radius: var(--radius-md);">
                <img id="wa-qr-image" src="" alt="QR" style="width: 100%; height: 100%;">
              </div>
            </div>
          </div>

          <!-- SESSION BACKUP & RECOVERY -->
          <div class="card">
            <div class="card-header">
              <span class="card-title">💾 Oturum Yedekleme & Sıfırlama</span>
            </div>
            <p style="color: var(--text-3); font-size: 13px; margin-bottom: 16px;">
              Baileys oturum kimlik doğrulamalarını yedekleyebilir veya çökme durumunda tek tıkla geri yükleyebilirsiniz.
            </p>

            <div style="display: flex; flex-direction: column; gap: 10px;">
              <button class="btn btn-secondary btn-block" onclick="backupSessionAction()">Oturumu Şimdi Yedekle</button>
              <button class="btn btn-secondary btn-block" onclick="restoreSessionAction()">Son Yedekten Geri Yükle</button>
              <button class="btn btn-danger btn-block" onclick="resetSessionAction()">Oturumu Tamamen Sıfırla & Çıkış Yap</button>
            </div>

            <div style="margin-top: 16px; padding: 12px; background: var(--bg-2); border-radius: var(--radius-md); font-size: 12px; color: var(--text-4);" id="wa-backup-status-text">
              Son yedek durumu: Bilinmiyor
            </div>
          </div>
        </div>
      </section>
