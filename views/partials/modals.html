<!-- VIDEO PLAYER MODAL -->
<div class="modal-backdrop" id="video-player-modal">
  <div class="modal-box" style="max-width: 800px; padding: 18px;">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px;">
      <h3 id="modal-video-title" style="font-size: 14px; font-weight: 700; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Video Oynatıcı</h3>
      <button class="btn btn-secondary btn-sm" onclick="closeVideoModal()">✕ Kapat</button>
    </div>
    <div style="background: #000; border-radius: var(--radius-md); overflow: hidden;">
      <video id="modal-plyr-video" playsinline controls style="width: 100%; max-height: 480px;"></video>
    </div>
  </div>
</div>

<!-- MULTI-FORMAT FILE PREVIEW MODAL (PDF / AUDIO / VIDEO / IMAGE) -->
<div class="modal-backdrop" id="file-preview-modal">
  <div class="modal-box" style="max-width: 900px; padding: 18px; width: 95%;">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 10px;">
      <div style="display: flex; align-items: center; gap: 8px; overflow: hidden; flex: 1;">
        <span class="badge badge-white" id="preview-modal-type-badge">DOSYA</span>
        <h3 id="preview-modal-title" style="font-size: 14px; font-weight: 700; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Önizleme</h3>
      </div>
      <div style="display: flex; gap: 8px; flex-shrink: 0;">
        <a id="preview-modal-download-link" href="#" download class="btn btn-secondary btn-sm">⬇️ İndir</a>
        <button class="btn btn-secondary btn-sm" onclick="closeFilePreviewModal()">✕ Kapat</button>
      </div>
    </div>
    <div id="preview-modal-body" style="background: #09090b; border: 1px solid var(--border-1); border-radius: var(--radius-md); overflow: hidden; display: flex; align-items: center; justify-content: center; min-height: 320px;">
      <!-- Dynamic Preview Body -->
    </div>
  </div>
</div>

<!-- FILE SEND TO WHATSAPP MODAL -->
<div class="modal-backdrop" id="file-send-wa-modal">
  <div class="modal-box" style="max-width: 480px; padding: 22px;">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span class="badge badge-white">WhatsApp</span>
        <h3 style="font-size: 15px; font-weight: 700; color: #fff;">Dosyayı Gönder</h3>
      </div>
      <button class="btn btn-secondary btn-sm" onclick="closeSendWaModal()">✕ Kapat</button>
    </div>
    <div class="form-group">
      <label class="form-label">Gönderilecek Dosya</label>
      <input type="text" id="wa-send-file-name" class="input-text" readonly style="background: var(--bg-2); color: #ffffff; font-weight: 600;">
    </div>
    <div class="form-group">
      <label class="form-label">Alıcı Telefon Numarası veya JID</label>
      <input type="text" id="wa-send-phone-input" class="input-text" placeholder="905332624732 veya 05332624732">
      <small style="color: var(--text-4); font-size: 11px; margin-top: 5px; display: block;">Varsayılan: 05332624732. Numaranın başına 90 veya 0 ekleyebilirsiniz.</small>
    </div>
    <div class="form-group">
      <label class="form-label">Başlık / Açıklama Notu (Opsiyonel)</label>
      <input type="text" id="wa-send-caption-input" class="input-text" placeholder="Örn: Solo Leveling Cilt 1">
    </div>
    <div style="display: flex; gap: 10px; margin-top: 20px;">
      <button class="btn btn-secondary" style="flex: 1;" onclick="closeSendWaModal()">Vazgeç</button>
      <button class="btn btn-primary" style="flex: 1;" id="wa-send-submit-btn" onclick="submitSendFileToWa()">WhatsApp'a Gönder 🚀</button>
    </div>
  </div>
</div>

<!-- QUEUE TASK DETAIL MODAL -->
<div class="modal-backdrop" id="queue-task-detail-modal">
  <div class="modal-box" style="max-width: 640px; padding: 22px;">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span class="badge badge-white" id="task-modal-id-badge">#1</span>
        <h3 style="font-size: 15px; font-weight: 700; color: #fff;">Görev Detay Bilgileri</h3>
      </div>
      <button class="btn btn-secondary btn-sm" onclick="closeTaskDetailModal()">✕ Kapat</button>
    </div>
    <div id="task-modal-content">
      <!-- Injected Task Details -->
    </div>
    <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px;">
      <button class="btn btn-secondary btn-sm" onclick="closeTaskDetailModal()">Kapat</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>
